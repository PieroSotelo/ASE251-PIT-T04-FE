<div class="login-container">
  <div class="login-content">
    <h1>Bienvenido(a)</h1>
    <p class="subtitle">Inicia sesión para poder visualizar el negocio</p>

    <div class="form-group">
      <label>Correo o Nombre de usuario:</label>
      <input type="text" placeholder="Ingresa tu nombre......" [(ngModel)]="usernameInput">
    </div>

    <div class="form-group">
      <label>Contraseña:</label>
      <input type="password" placeholder="Ingresa tu contraseña......" [(ngModel)]="password">
    </div>

    <button class="btn-login" (click)="login()">Iniciar sesión</button>

    <div class="footer-links">
      <a class="link-red" (click)="goToRegister()">¿Aún no tienes cuantas?</a>
      <a class="link-red" (click)="goToRegister()">Regístrate</a>
    </div>
  </div>
</div>
